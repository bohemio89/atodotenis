name: Prueba Getty
on:
  push:
    branches: [media]
    paths: [media/getty-prueba.txt]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar y pedir el código de inserción
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -s -A "$UA" -o s.html -w "busqueda %{http_code} %{size_download}\n" "https://www.gettyimages.com/search/2/image?phrase=daniil%20medvedev%20turin&sort=newest&family=editorial"
          grep -o '/detail/news-photo/[a-z0-9-]*/[0-9]\{6,\}' s.html | head -5
          ID=$(grep -o '/detail/news-photo/[a-z0-9-]*/[0-9]\{6,\}' s.html | head -1 | grep -o '[0-9]\{6,\}$')
          echo "id=$ID"
          curl -s -A "$UA" -w "\noembed %{http_code}\n" "https://embed.gettyimages.com/oembed?url=https%3A%2F%2Fgty.im%2F${ID:-2305389420}" | head -c 1500
