name: Prueba Getty
on:
  push:
    branches: [media]
    paths: [media/getty-prueba.txt]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Nota de prueba con Gemini (no se publica)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRUEBA_PARTIDOS: '219742'
        run: |
          node scripts/articles.mjs
          f=$(ls -t content/notas/*.json | head -1); node -e "const n=require('./'+process.argv[1]);console.log('RESULTADO',n.generadoCon,'|',n.titulo,'|',n.cuerpo.length,'párrafos');console.log(n.cuerpo.join('\n'))" "$f"
