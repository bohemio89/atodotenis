name: Prueba Getty
on:
  push:
    branches: [media]
    paths: [media/getty-prueba.txt]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in 2305110895 2305169093 2305552799 2305719110; do echo "== $id"; curl -s -w ' HTTP%{http_code}' "https://embed.gettyimages.com/oembed?url=https%3A%2F%2Fgty.im%2F$id" | head -c 300; echo; done
