name: Prueba Getty
on:
  push:
    branches: [media]
    paths: [media/getty-prueba.txt]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: media }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium >/dev/null
      - run: node media/getty-prueba.mjs || true
