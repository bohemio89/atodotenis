name: Prueba Getty
on:
  push:
    branches: [media]
    paths: [media/getty-prueba.txt]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: media }
      - run: npm i --no-save --silent playwright-core
      - run: SLUGS="2026-11-15-zverev-jodar-finals-turin,2026-11-15-shelton-fils-finals-turin" node scripts/getty.mjs
      - run: grep -h -A6 '"getty"' content/notas/2026-11-15-zverev-jodar-finals-turin.json content/notas/2026-11-15-shelton-fils-finals-turin.json || true
