name: Prueba Getty
on:
  push:
    branches: [media]
    paths: [media/getty-prueba.txt]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: media }
      - run: DEPURAR=1 SLUGS="2026-11-17-zverev-shelton-finals-turin" node scripts/getty.mjs
      - run: grep -h -A6 '"getty"' content/notas/2026-11-17-zverev-shelton-finals-turin.json || true
