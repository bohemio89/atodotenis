name: Buscar fotos de Shelton (prueba)
on:
  push:
    branches: [media]
    paths: [media/shelton-pedido.txt]
permissions: { contents: write }
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: media }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node media/shelton-buscar.mjs
      - run: |
          git config user.name "A Todo Tenis bot" && git config user.email "bot@atodotenis.local"
          git add media/shelton && git commit -m "Fotos de Shelton candidatas" && git push || true
