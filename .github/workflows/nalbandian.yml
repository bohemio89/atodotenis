name: Material Nalbandian
on:
  push:
    branches: [media]
    paths: [media/nalbandian.mjs]
permissions: { contents: write }
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: media }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node media/nalbandian.mjs
      - run: |
          git config user.name "A Todo Tenis bot" && git config user.email "bot@atodotenis.local"
          git add media/nalbandian && git commit -m "Material Nalbandian" && git pull --rebase -q && git push || true
