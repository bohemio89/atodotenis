name: Prueba de fuentes
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://www.nittoatpfinals.com/en/news" \
            "https://ausopen.com/news" \
            "https://www.rolandgarros.com/en-us/news" \
            "https://www.wimbledon.com/en_GB/news/index.html" \
            "https://www.usopen.org/en_US/news/index.html" \
            "https://api.wtatennis.com/content/wta/text/EN/?pageSize=5" ; do
            code=$(curl -s -o /tmp/r -w "%{http_code}" -A "Mozilla/5.0 (compatible; AtodoTenisBot/1.0)" -L --max-time 25 "$u")
            echo "== $code $(wc -c </tmp/r) $u"; head -c 400 /tmp/r | tr '\n' ' '; echo
          done
