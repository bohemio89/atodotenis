name: Validar optimización API

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxis del recolector
        run: node --check scripts/update.mjs
      - name: Ejecutar pruebas de planificación
        run: npm test
      - name: Compilar sitio estático
        run: node scripts/build.mjs
