name: Fotos para Instagram (temporal)
on: workflow_dispatch
permissions: { contents: write }
concurrency: { group: actualizar, cancel-in-progress: false }
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p static/ig/fotos
          node -e '
          const f=require("./scripts/ig-fotos.json");const fs=require("fs");
          (async()=>{for(const [s,v] of Object.entries(f)){const r=await fetch(v.url,{headers:{"User-Agent":"ATodoTenis/1.0 (https://atodotenis.vercel.app)"}});console.log(s,r.status);if(r.ok)fs.writeFileSync("static/ig/fotos/"+s+".jpg",Buffer.from(await r.arrayBuffer()));await new Promise(r=>setTimeout(r,400));}})()'
          git config user.name "A Todo Tenis bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/ig/fotos && git commit -m "Fotos para Instagram" && git pull --rebase -q && git push
