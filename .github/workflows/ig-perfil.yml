name: Instagram - revisar perfil y bajar foto
on: workflow_dispatch
permissions: { contents: write }
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: node scripts/instagram.mjs perfil
      - name: Foto de Mirra Andreeva (Wikimedia Commons, Hameltion, CC BY-SA 4.0)
        run: |
          UA="ATodoTenis/1.0 (https://atodotenis.vercel.app)"
          curl -fsSL -A "$UA" -o static/ig/fotos/mirra-andreeva.jpg "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Mirra_Andreeva_%282023_US_Open%29_10_%28cropped%29.jpg/500px-Mirra_Andreeva_%282023_US_Open%29_10_%28cropped%29.jpg"
          file static/ig/fotos/mirra-andreeva.jpg
          git config user.name "A Todo Tenis" && git config user.email "actions@users.noreply.github.com"
          git add static/ig/fotos && git commit -m "Foto de Mirra Andreeva" && git push || true
