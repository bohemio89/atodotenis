name: Foto de Getty para una nota
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: { group: actualizar, cancel-in-progress: false }
jobs:
  poner-foto:
    # Solo el dueño del sitio puede cambiar fotos
    if: contains(github.event.issue.labels.*.name, 'foto-getty') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: foto
        env:
          CUERPO: ${{ github.event.issue.body }}
        run: node scripts/foto-getty.mjs
      - name: Guardar
        if: steps.foto.outputs.ok == 'true'
        run: |
          git config user.name "A Todo Tenis"
          git config user.email "actions@users.noreply.github.com"
          git add content/notas
          git commit -m "Foto de Getty en una nota (#${{ github.event.issue.number }})"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: Responder y cerrar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ steps.foto.outputs.msg }}
        run: |
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body "$MSG"
          if [ "${{ steps.foto.outputs.ok }}" = "true" ]; then gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }}; fi
