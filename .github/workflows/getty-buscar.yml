name: Buscar fotos en Getty
on:
  push:
    branches: [media]
    paths: [media/getty-buscar.txt]
permissions: { contents: write }
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: media }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install chromium
      - run: node media/getty-buscar.mjs
      - run: |
          git config user.name "A Todo Tenis bot" && git config user.email "bot@atodotenis.local"
          git add media/getty-buscar && git commit -m "Busqueda Getty" && git pull --rebase -q && git push || true
