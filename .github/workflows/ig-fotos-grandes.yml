name: Instagram - fotos grandes
on:
  workflow_dispatch:
    inputs:
      nombres: { description: 'Nombres separados por coma', required: true }
permissions: { contents: write }
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          node -e '
          import("./scripts/lib/ig-render.mjs").then(async ({ fotoJugador }) => {
            for (const n of process.argv[1].split(",")) console.log("FOTO", n, (await fotoJugador(n.trim(), 1280)) ? "ok" : "falta");
          })' "${{ inputs.nombres }}"
      - run: |
          git config user.name "A Todo Tenis" && git config user.email "actions@users.noreply.github.com"
          git add static/ig/fotos data/avatares.json && git commit -m "Fotos grandes" && git pull --rebase -q && git push || true
