name: Instagram - publicar carruseles
on: workflow_dispatch
permissions: { contents: write }
concurrency: { group: actualizar, cancel-in-progress: false }
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          IG_FORZAR: '1'   # a mano: publica sin esperar la tanda
        run: node scripts/instagram.mjs carruseles
      - run: |
          git config user.name "A Todo Tenis bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram.json && git commit -m "Instagram: carruseles publicados" && git pull --rebase -q && git push || true
