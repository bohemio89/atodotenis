name: Actualizar sitio


on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/actualizar.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'   # cada 15 minutos; la API se consulta como mucho una vez por hora
  workflow_dispatch:
    inputs:
      prueba_partidos:
        description: 'Solo para pruebas: IDs de partidos (separados por coma) para escribir notas sin publicarlas'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Traer datos de tenis
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: node scripts/update.mjs
      - name: Ranking oficial ATP y WTA
        run: 'node scripts/ranking-oficial.mjs || echo "Ranking oficial, se reintentara"'
      - name: Escribir notas con IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRUEBA_PARTIDOS: ${{ github.event.inputs.prueba_partidos }}
        run: node scripts/articles.mjs
      - name: Buscar fotos recientes con licencia libre
        run: node scripts/fotos.mjs
      - name: Países de las jugadoras (ranking oficial WTA)
        run: node scripts/paises-wta.mjs
      - name: Buscar declaraciones oficiales
        continue-on-error: true
        timeout-minutes: 1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: timeout 50s node scripts/declaraciones.mjs || echo "Se omiten declaraciones para no bloquear la actualización del sitio."
      - name: Traducir notas al inglés
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/traducir-notas.mjs
      - name: Buscar highlights en YouTube
        run: node scripts/videos.mjs
      - name: Fotos para el ranking
        run: node scripts/avatares.mjs
      - name: TikTok (generar videos para descarga)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          npm i --no-save --no-audit --no-fund --silent playwright-core @fontsource/inter @fontsource/montserrat @fontsource/roboto-condensed
          node scripts/tiktok.mjs || echo "TikTok: se reintentará en la próxima corrida"
      - name: Instagram (publicar y preparar la siguiente)
        timeout-minutes: 3
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          npm i --no-save --no-audit --no-fund --silent playwright-core @fontsource/inter @fontsource/montserrat @fontsource/roboto-condensed
          node scripts/ig-series.mjs || echo "Series: error"
          node scripts/instagram.mjs preparar
          node scripts/instagram.mjs salida
          node scripts/instagram.mjs preparar
      - name: Probar que el sitio se genera bien
        run: node scripts/build.mjs
      - name: Guardar cambios
        run: |
          git config user.name "A Todo Tenis bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data content static/ig static/tiktok
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          # Vercel (plan gratis) admite 100 publicaciones por día. Si solo cambiaron datos de resultados,
          # se publica como mucho cada 30 minutos; notas, imágenes y estado de Instagram se guardan siempre.
          IMPORTANTE=$(git diff --cached --name-only | grep -E '^(content/|static/|data/instagram.json|data/ig-carruseles.json|data/tiktok.json)' || true)
          ULTIMA=$(git log -1 --format=%ct --author="A Todo Tenis bot" 2>/dev/null || echo 0)
          if [ -z "$IMPORTANTE" ] && [ $(( $(date +%s) - ULTIMA )) -lt 1740 ]; then echo "Solo datos y la última publicación fue hace menos de 30 minutos: se espera"; exit 0; fi
          git commit -m "Actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -X ours origin main || true
          git push
