name: Actualizar sitio

on:
  schedule:
    - cron: '17 * * * *'   # cada hora, al minuto 17
  workflow_dispatch: {}     # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Traer datos de tenis
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: node scripts/update.mjs

      - name: Escribir notas con IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/articles.mjs

      - name: Probar que el sitio se genera bien
        run: node scripts/build.mjs

      - name: Guardar cambios
        run: |
          git config user.name "A Todo Tenis bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data content
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -X ours origin main || true
          git push
